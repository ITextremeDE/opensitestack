name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} — contracts and rendered reference
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Accessibility and consent lifecycle
        run: pnpm test:browser
      - name: Mobile Lighthouse and transfer budgets
        run: pnpm quality:budgets
      - name: Retain synthetic quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-quality-node-${{ matrix.node }}-${{ github.sha }}
          path: |
            .lighthouseci/
            var/quality/
            test-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  gate:
    name: check
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both supported Node majors
        run: test '${{ needs.check.result }}' = 'success'
